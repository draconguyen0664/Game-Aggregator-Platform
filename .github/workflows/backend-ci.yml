name: Backend CI

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  spring-boot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven
      - run: chmod +x "Spring Boot/mvnw"
      - run: "Spring Boot/mvnw" -f pom.xml --batch-mode verify

  golang:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Golang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: Backend/Golang/go.sum
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test ./...

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp Backend/infrastructure/docker/.env.example Backend/infrastructure/docker/.env
      - run: docker compose --env-file Backend/infrastructure/docker/.env -f Backend/infrastructure/docker/compose.yml config --quiet
