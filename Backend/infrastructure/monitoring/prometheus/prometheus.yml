global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: go-api-gateway
    static_configs:
      - targets: ["go-api-gateway:8080"]
  - job_name: go-log-ingestion
    static_configs:
      - targets: ["go-log-ingestion:8080"]
  - job_name: go-realtime-monitoring
    static_configs:
      - targets: ["go-realtime-monitoring:8080"]