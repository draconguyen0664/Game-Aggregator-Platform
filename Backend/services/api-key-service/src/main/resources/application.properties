spring.application.name=api-key-service
server.port=8091
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_key_service}
spring.datasource.username=${DB_USERNAME:game_app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:change-me}
spring.data.redis.timeout=2s
management.endpoints.web.exposure.include=health,info,prometheus
security.jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
api-key.pepper=${API_KEY_PEPPER:change-this-api-key-pepper-at-least-32-bytes}