      DB_URL: jdbc:mysql://mysql:3306/audit_service?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-game_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8101:8101"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [platform]
  incident-service:
    build: ../../services/incident-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8102
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      DB_URL: jdbc:mysql://mysql:3306/incident_service?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-game_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports: ["8102:8102"]
    depends_on: { mysql: { condition: service_healthy } }
    networks: [platform]
  feature-flag-service:
    build: ../../services/feature-flag-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8103
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      DB_URL: jdbc:mysql://mysql:3306/feature_flag_service?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-game_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports: ["8103:8103"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [platform]
  go-api-gateway:
    build:
      context: ../../Golang
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      KAFKA_BROKERS: kafka:9092
      API_KEY_PEPPER: ${API_KEY_PEPPER:?Set API_KEY_PEPPER in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      GATEWAY_ROUTES: '[{"prefix":"/auth","upstream":"http://auth-service:8081","scope":"auth:access"},{"prefix":"/api/v1/games","upstream":"http://game-service:8088","scope":"game:read"},{"prefix":"/api/v1/game-media","upstream":"http://game-media-service:8089","scope":"game:read"},{"prefix":"/api/v1/entitlements","upstream":"http://entitlement-service:8090","scope":"entitlement:read"},{"prefix":"/api/v1/builds","upstream":"http://build-service:8093","scope":"release:read"},{"prefix":"/api/v1/releases","upstream":"http://release-service:8094","scope":"release:read"},{"prefix":"/api/v1/deployments","upstream":"http://deployment-service:8095","scope":"release:deploy"}]'
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [platform]
  go-analytics-consumer:
    build:
      context: ../../Golang
      dockerfile: services/analytics-consumer/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_USER:-game_app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@tcp(mysql:3306)/analytics_service?parseTime=true&charset=utf8mb4
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [platform]
  go-log-ingestion:
    build:
      context: ../../Golang
      dockerfile: services/log-ingestion/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      KAFKA_BROKERS: kafka:9092
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:?Set LOG_INGEST_TOKEN in .env}
    ports: ["8104:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    networks: [platform]
  go-realtime-monitoring:
    build:
      context: ../../Golang
      dockerfile: services/realtime-monitoring/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      KAFKA_BROKERS: kafka:9092
      MONITORING_TOKEN: ${MONITORING_TOKEN:?Set MONITORING_TOKEN in .env}
    ports: ["8105:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    networks: [platform]
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [platform]

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [platform]

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [platform]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ../monitoring/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on: [tempo]
    networks: [platform]

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [platform]

networks:
  platform:
    name: game-aggregator-platform

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

