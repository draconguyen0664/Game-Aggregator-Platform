spring.application.name=webhook-service
server.port=8100
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webhook_service}
spring.datasource.username=${DB_USERNAME:game_app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management.endpoints.web.exposure.include=health,info,prometheus
security.jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
webhook.worker.delay-ms=${WEBHOOK_WORKER_DELAY_MS:1000}
webhook.master-key=${WEBHOOK_MASTER_KEY:change-this-webhook-master-key-at-least-32-bytes}
resilience4j.circuitbreaker.instances.webhook.sliding-window-size=20
resilience4j.circuitbreaker.instances.webhook.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.webhook.wait-duration-in-open-state=30s
