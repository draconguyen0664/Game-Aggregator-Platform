spring.application.name=feature-flag-service
server.port=8103
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/feature_flag_service}
spring.datasource.username=${DB_USERNAME:game_app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management.endpoints.web.exposure.include=health,info,prometheus
security.jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:change-me}
