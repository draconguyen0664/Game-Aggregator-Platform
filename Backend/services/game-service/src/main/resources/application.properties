spring.application.name=game-service
server.port=8088
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/game_service}
spring.datasource.username=${DB_USERNAME:game_app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
security.jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
