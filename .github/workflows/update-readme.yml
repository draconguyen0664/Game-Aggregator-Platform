name: Update README

on:
  pull_request:
    paths:
      - "Backend/**"
      - "Front End/**"
      - "scripts/update-readme.ps1"
      - ".github/workflows/update-readme.yml"
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - "Front End/**"
      - "scripts/update-readme.ps1"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
      - name: Generate README
        shell: pwsh
        run: ./scripts/update-readme.ps1
      - name: Verify README on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- README.md
      - name: Commit README on main
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update generated README sections"
          git push
