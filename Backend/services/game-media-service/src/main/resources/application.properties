spring.application.name=game-media-service
server.port=8089
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/game_media_service}
spring.datasource.username=${DB_USERNAME:game_app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
security.jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.region=${STORAGE_REGION:us-east-1}
storage.bucket=${STORAGE_BUCKET:game-assets}
storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
storage.secret-key=${STORAGE_SECRET_KEY:change-me}
